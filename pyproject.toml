[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lmu-corner-cues"
version = "0.1.0"
description = "Deterministic lap-aware corner cues for Le Mans Ultimate"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
extraPaths = ["src"]
pythonVersion = "3.9"
